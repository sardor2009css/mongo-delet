<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahifa — Mahsulotlar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }

    .bg-glow {
      background:
        radial-gradient(60rem 40rem at 10% -10%, rgba(99, 102, 241, .35), transparent 60%),
        radial-gradient(50rem 35rem at 110% 10%, rgba(16, 185, 129, .22), transparent 60%),
        radial-gradient(45rem 35rem at 50% 120%, rgba(236, 72, 153, .18), transparent 60%);
    }

    .hover-glow:hover { box-shadow: 0 20px 40px -20px rgba(99, 102, 241, .55); }
    .active:scale-95 { transition: transform .08s ease; }

    @keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    .animate-pop { animation: pop .25s ease-out both; }

    @keyframes slideIn { from { transform: translateY(8px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    .animate-slide { animation: slideIn .3s ease-out both; }

    @keyframes toastIn { from { transform: translateX(120%) } to { transform: translateX(0) } }
    .animate-toast { animation: toastIn .3s cubic-bezier(.22, 1, .36, 1) both; }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="bg-glow fixed inset-0 -z-10"></div>

  <header class="sticky top-0 z-20 border-b border-white/10 bg-slate-950/70 backdrop-blur-xl">
    <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-4 sm:px-6">
      <div class="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 to-emerald-400 text-xl font-black shadow-lg shadow-indigo-500/30">S</div>
      <div>
        <h1 class="text-lg font-extrabold tracking-tight sm:text-xl">Sahifa</h1>
        <p class="text-xs text-slate-400">Mahsulotlarni boshqarish paneli</p>
      </div>
      <span id="umumiySoni" class="ml-auto rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-300">0 ta mahsulot</span>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
    <div class="grid gap-6 lg:grid-cols-[360px_1fr]">

      <section class="h-fit rounded-3xl border border-white/10 bg-white/[.04] p-5 shadow-2xl shadow-black/40 backdrop-blur-xl">
        <h2 class="mb-4 flex items-center gap-2 text-sm font-bold uppercase tracking-wider text-slate-300">
          <span class="grid h-6 w-6 place-items-center rounded-lg bg-indigo-500/20 text-indigo-300">+</span>
          Yangi mahsulot
        </h2>

        <form id="forma" class="space-y-3">
          <input id="name" type="text" placeholder="Nomi (masalan: Noutbuk)" required
            class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-3 text-sm outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30" />

          <select id="category" required
            class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30">
            <option value="">Kategoriya tanlang</option>
            <option value="elektronika">Elektronika</option>
            <option value="kiyim">Kiyim</option>
            <option value="kitob">Kitob</option>
            <option value="oziq-ovqat">Oziq-ovqat</option>
          </select>

          <div class="grid grid-cols-2 gap-3">
            <input id="price" type="number" min="0" step="0.01" placeholder="Narxi" required
              class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-3 text-sm outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30" />
            <input id="qty" type="number" min="0" value="1" placeholder="Soni" required
              class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-3 text-sm outline-none transition placeholder:text-slate-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30" />
          </div>

          <button type="submit"
            class="active:scale-95 w-full rounded-xl bg-gradient-to-r from-indigo-500 to-violet-500 px-4 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-500/30 transition hover:from-indigo-400 hover:to-violet-400">Qo'shish</button>
        </form>
      </section>

      <section>
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">Mahsulotlar</h2>
          <button id="yangilash" class="active:scale-95 rounded-lg border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-300 transition hover:bg-white/10">Yangilash</button>
        </div>

        <div id="royxat" class="grid gap-3 sm:grid-cols-2"></div>

        <div id="bosq" class="hidden rounded-3xl border border-dashed border-white/15 bg-white/[.03] px-6 py-16 text-center">
          <p class="text-4xl">📦</p>
          <p class="mt-3 font-semibold text-slate-300">Hali mahsulot yo'q</p>
          <p class="mt-1 text-sm text-slate-500">Chap tomondagi forma orqali birinchi mahsulotni qo'shing</p>
        </div>
      </section>

    </div>
  </main>

  <div id="toastlar" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <script src="/app.js"></script>
</body>
</html>
